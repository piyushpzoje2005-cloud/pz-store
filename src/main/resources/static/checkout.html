<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PZ Store</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">PZ Store</div>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/products.html">Products</a>
        <a href="/cart.html">Cart</a>
    </nav>
</header>

<section class="featured">

    <h1>Checkout</h1>

    <form id="checkoutForm">

        <input type="text" id="fullName" placeholder="Full Name" required>

        <input type="tel" id="phone" placeholder="Mobile Number" required>

        <textarea id="address" placeholder="Full Address" required></textarea>

        <input type="text" id="city" placeholder="City" required>

        <input type="text" id="state" placeholder="State" required>

        <input type="text" id="pincode" placeholder="PIN Code" required>

        <h3 id="orderTotal">Total: ₹0</h3>

        <button type="submit" class="btn">Place Order (COD)</button>

    </form>

</section>

<script src="/js/checkout.js"></script>

</body>
</html>
